[package]
name = "copycopy"
version = "2.0.0"
description = "CopyCopy manga desktop client"
authors = ["CopyCopy"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "copycopy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
ui-smoke-test = []

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream"] }
futures = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
semver = "1"
sha2 = "0.10"
hex = "0.4"
urlencoding = "2"
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
lopdf = "0.38"
log = "0.4"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
