name: Publish CopyCopy desktop
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Validate stable tag and source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const p = require("./package.json"); if (!/^\d+\.\d+\.\d+$/.test(p.version) || process.env.RELEASE_TAG !== "v" + p.version) process.exit(1)'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
  checks:
    needs: validate
    uses: ./.github/workflows/desktop.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CopyCopy-Windows-${{ github.sha }}
          path: installer
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e 'import fs from "node:fs";import crypto from "node:crypto";const m=JSON.parse(fs.readFileSync("installer/manifest.json"));if(m.commit!==process.env.GITHUB_SHA||"v"+m.version!==process.env.RELEASE_TAG||crypto.createHash("sha256").update(fs.readFileSync("installer/"+m.file)).digest("hex")!==m.sha256)process.exit(1)'
          gh release create "$RELEASE_TAG" installer/*.exe installer/manifest.json --repo "$GITHUB_REPOSITORY" --verify-tag --title "CopyCopy $RELEASE_TAG" --generate-notes
